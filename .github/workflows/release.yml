name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          ./gradlew :scizor:assembleRelease :scizor-no-op:assembleRelease \
                    :scizor:testDebugUnitTest :sample:assembleDebug :sample:assembleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Warm the JitPack build
        # JitPack builds lazily on first *artifact* resolution — requesting the POM is
        # what a consumer's Gradle does, and it is what actually triggers a build.
        # The /api/builds/ endpoint only reports status and does not trigger anything;
        # it has also been observed returning "none" while the artifact was already
        # being served, so it is not a reliable check either. Fetching the POM here
        # means the first real consumer gets a cached artifact rather than waiting
        # through a cold build.
        #
        # Non-fatal by design: the release is already cut by this point, and JitPack
        # will build on demand regardless. A slow cold build can exceed the timeout
        # and still succeed.
        run: |
          for artifact in scizor scizor-no-op; do
            url="https://jitpack.io/com/github/bstillitano/scizor/${artifact}/${GITHUB_REF_NAME}/${artifact}-${GITHUB_REF_NAME}.pom"
            if curl -fsS -m 600 -o /dev/null "$url"; then
              echo "JitPack has built and served ${artifact} ${GITHUB_REF_NAME}"
            else
              echo "Could not warm ${artifact} ${GITHUB_REF_NAME} — the first consumer to"
              echo "resolve it will trigger the build. See https://jitpack.io/#bstillitano/scizor"
            fi
          done
