name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build and test
        run: |
          ./gradlew :scizor:assembleRelease :scizor-no-op:assembleRelease \
                    :scizor:testDebugUnitTest :sample:assembleDebug :sample:assembleRelease

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

      - name: Ask JitPack to build the tag
        # JitPack's build API is /api/builds/{group}/{artifact}/{version}, so each
        # module needs its own call. -f is what makes a 404 an error: without it curl
        # exits 0 on any HTTP status and the fallback below can never fire.
        run: |
          for artifact in scizor scizor-no-op; do
            curl -fsS -m 300 \
              "https://jitpack.io/api/builds/com.github.bstillitano.scizor/${artifact}/${GITHUB_REF_NAME}" \
              || echo "JitPack build request for ${artifact} failed; check https://jitpack.io/#bstillitano/scizor"
          done
